<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea V11 - 03 Dose History</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  /* Brand colors: #FFFDF7 #1A1D3D #D4A574 #C4956A #86A89A */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1320px; height: 2868px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden; color: #1A1D3D; position: relative;
    display: flex; flex-direction: column;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 60px 96px 0; font-size: 48px; font-weight: 600; flex-shrink: 0;
  }
  .caption-band {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #1A1D3D; border-radius: 80px 80px 0 0;
    padding: 100px 100px 140px;
  }
  .caption-band h1 { font-size: 116px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: -3px; }
  .caption-band p { font-size: 58px; font-weight: 500; color: rgba(255,255,255,0.72); margin-top: 32px; line-height: 1.4; }
  .app-content { flex: 1; position: relative; }
  .cal-day { width:calc(100%/7); aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:600; color:#1A1D3D; position:relative; }
  .cal-day.marked::after { content:''; position:absolute; bottom:15%; width:20px; height:20px; background:#86A89A; border-radius:50%; }
  .cal-day.scheduled { background:rgba(212,165,116,0.15); border-radius:24px; color:#D4A574; font-weight:800; }
</style>
</head>
<body>
<div class="status-bar">

    <svg width="72" height="32" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>
  </div>
</div>

    </div>
    <div style="display:flex">
      <div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day">1</div><div class="cal-day">2</div><div class="cal-day">3</div><div class="cal-day">4</div>
    </div>
    <div style="display:flex">
      <div class="cal-day">5</div>
      <div class="cal-day marked">6</div>
      <div class="cal-day">7</div><div class="cal-day">8</div><div class="cal-day">9</div><div class="cal-day">10</div><div class="cal-day">11</div>
    </div>

      <div class="cal-day marked">13</div>
      <div class="cal-day">14</div><div class="cal-day">15</div><div class="cal-day">16</div><div class="cal-day">17</div><div class="cal-day">18</div>
    </div>
    <div style="display:flex">
      <div class="cal-day">19</div>
      <div class="cal-day scheduled">20</div>
      <div class="cal-day">21</div><div class="cal-day">22</div><div class="cal-day">23</div><div class="cal-day">24</div><div class="cal-day">25</div>
    </div>
    
    <div style="display:flex;gap:50px;margin-top:50px;justify-content:center">

        <div style="width:28px;height:28px;background:#86A89A;border-radius:50%"></div>

    </div>
  </div>

  <div style="margin:48px 100px 0;background:#fff;border-radius:60px;padding:60px;box-shadow:0 8px 30px rgba(0,0,0,0.03);display:flex;align-items:center;gap:50px;border: 3px solid #F7F2EA">
    <div style="width:100px;height:100px;background:#86A89A;border-radius:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div>
      <div style="font-size:52px;font-weight:800">Monday, Oct 13</div>
      <div style="font-size:42px;color:#6E7585;margin-top:10px">2.5 mg · Left Abdomen</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea – S1 Welcome</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    color: #1A1D3D;
  }

  /* Status bar */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 54px 90px 0;
    font-size: 48px; font-weight: 600;
  }
  .status-icons { display: flex; gap: 18px; align-items: center; }

  /* Progress bar — empty on step 0 */
  .progress-bar { height: 8px; background: #EDE8E2; margin-top: 18px; }

  /* Caption band */
  .caption-band {
    margin: 80px 90px 0;
    background: linear-gradient(135deg, #C4956A 0%, #D4A574 100%);
    border-radius: 54px;
    padding: 80px 90px;
    text-align: center;
  }
  .caption-band h1 { font-size: 100px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -3px; }
  .caption-band p { font-size: 54px; font-weight: 500; color: rgba(255,255,255,0.88); margin-top: 24px; line-height: 1.35; }

  /* App screen card */
  .screen-card {
    margin: 72px 90px 0;
    background: #fff;
    border-radius: 72px;
    padding: 90px 80px;
    box-shadow: 0 24px 80px rgba(196,149,106,0.18);
    display: flex; flex-direction: column; align-items: center; gap: 60px;
  }

  /* App icon */
  .app-icon {
    width: 216px; height: 216px;
    background: linear-gradient(135deg, #C4956A, #D4A574);
    border-radius: 54px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 48px rgba(196,149,106,0.4);
  }

  .app-title { font-size: 120px; font-weight: 900; color: #1A1D3D; letter-spacing: -3px; }
  .app-sub { font-size: 50px; font-weight: 500; color: #6E7585; margin-top: 12px; text-align: center; }

  /* Feature list */
  .feature-list { width: 100%; background: #FAFAF8; border: 2px solid #EDE8E2; border-radius: 48px; padding: 60px 72px; display: flex; flex-direction: column; gap: 44px; }
  .feature-item { display: flex; align-items: center; gap: 42px; }
  .check-dot {
    width: 72px; height: 72px; border-radius: 50%;
    background: #D4A574;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .feature-text { font-size: 54px; font-weight: 600; color: #1A1D3D; }

  /* CTA button */
  .cta-btn {
    width: 100%;
    background: #D4A574;
    border-radius: 48px;
    padding: 60px 0;
    text-align: center;
    box-shadow: 0 12px 36px rgba(212,165,116,0.4);
  }
  .cta-btn span { font-size: 64px; font-weight: 800; color: #fff; }

  /* Bottom info */
  .bottom-band {
    margin: 60px 90px 0;
    background: #F7F2EA;
    border-radius: 48px;
    padding: 60px 90px;
    display: flex; align-items: center; justify-content: space-between; gap: 36px;
  }
  .bottom-band p { font-size: 46px; font-weight: 500; color: #6E7585; line-height: 1.4; }
  .free-badge {
    background: linear-gradient(135deg, #D4A574, #C4956A);
    border-radius: 30px; padding: 24px 48px; flex-shrink: 0;
    font-size: 44px; font-weight: 800; color: #fff; white-space: nowrap;
  }
</style>
</head>
<body>

<!-- Status bar -->
<div class="status-bar">

    <svg width="66" height="30" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="60" y="9" width="6" height="12" rx="3" fill="#1A1D3D" opacity="0.4"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>

</body>
</html>

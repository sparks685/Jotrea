<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea – S2 Goal Weight</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    color: #1A1D3D;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 54px 90px 0;
    font-size: 48px; font-weight: 600;
  }
  .status-icons { display: flex; gap: 18px; align-items: center; }

  /* Progress bar — step 5 of 14 = ~36% */
  .progress-bar-wrap { height: 8px; background: #EDE8E2; margin-top: 18px; }
  .progress-bar-fill { height: 8px; width: 36%; background: #D4A574; border-radius: 0 4px 4px 0; }

  /* Caption band */
  .caption-band {
    margin: 80px 90px 0;
    background: linear-gradient(135deg, #1A1D3D 0%, #2D3163 100%);
    border-radius: 54px;
    padding: 80px 90px;
    text-align: center;
  }
  .caption-band h1 { font-size: 100px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -3px; }
  .caption-band p { font-size: 54px; font-weight: 500; color: rgba(255,255,255,0.8); margin-top: 24px; line-height: 1.35; }

  /* App screen card */
  .screen-card {
    margin: 72px 90px 0;
    background: #fff;
    border-radius: 72px;
    padding: 72px 80px 80px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.08);
  }

  /* Back button */
  .back-btn {
    width: 80px; height: 80px; border-radius: 50%;
    background: #F7F2EA; border: 2px solid #EDE8E2;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 54px;
  }

  .step-title { font-size: 96px; font-weight: 900; color: #1A1D3D; letter-spacing: -2px; margin-bottom: 18px; }
  .step-sub { font-size: 50px; color: #6E7585; margin-bottom: 72px; }

  /* Dream weight display */
  .weight-display { text-align: center; margin-bottom: 60px; }
  .weight-label { font-size: 36px; font-weight: 600; color: #D4A574; letter-spacing: 6px; text-transform: uppercase; }
  .weight-value { font-size: 192px; font-weight: 900; color: #1A1D3D; letter-spacing: -6px; line-height: 1; margin-top: 18px; }
  .weight-unit { font-size: 60px; font-weight: 400; color: #6E7585; margin-top: 12px; }

  /* Ruler */
  .ruler-wrap {
    position: relative;
    height: 240px;
    margin: 0 -20px;
    overflow: hidden;
  }
  .ruler-mask {
    position: absolute; inset: 0;
    background: linear-gradient(to right, #fff 0%, transparent 12%, transparent 88%, #fff 100%);
    z-index: 2;
    pointer-events: none;
  }
  /* Center needle */
  .ruler-needle {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 5px;
    margin-left: -2.5px;
    z-index: 3;
    background: linear-gradient(to bottom, rgba(212,165,116,0) 0%, #D4A574 8%, #D4A574 72%, rgba(212,165,116,0.1) 100%);
    border-radius: 9999px;
    box-shadow: 0 0 20px rgba(212,165,116,0.6);
  }
  .ruler-inner { display: flex; align-items: flex-end; height: 100%; padding-bottom: 0; }
  .ruler-tick { flex-shrink: 0; width: 60px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .tick-bar { border-radius: 9999px; }
  .tick-label { font-size: 26px; font-weight: 600; color: rgba(156,163,175,0.7); margin-top: 14px; }
  .tick-label-active { font-size: 30px; font-weight: 800; color: #1A1D3D; margin-top: 14px; }

  /* Motivational badge */
  .goal-badge {
    display: flex; align-items: center; gap: 18px;
    background: rgba(212,165,116,0.1); color: #D4A574;
    border-radius: 60px; padding: 30px 48px;
    font-size: 44px; font-weight: 600;
    margin-top: 60px; justify-content: center;
  }

  /* Continue button */
  .cta-btn {
    width: 100%;
    background: #D4A574;
    border-radius: 48px;
    padding: 60px 0;
    text-align: center;
    box-shadow: 0 12px 36px rgba(212,165,116,0.35);
    margin-top: 72px;
  }
  .cta-btn span { font-size: 64px; font-weight: 800; color: #fff; }

  /* Bottom highlight */
  .bottom-band {
    margin: 60px 90px 0;
    background: linear-gradient(135deg, rgba(212,165,116,0.08), rgba(212,165,116,0.15));
    border: 2px solid rgba(212,165,116,0.25);
    border-radius: 48px;
    padding: 60px 90px;
    text-align: center;
  }
  .bottom-band p { font-size: 46px; font-weight: 600; color: #6E7585; }
  .bottom-band strong { color: #D4A574; }
</style>
</head>
<body>

<div class="status-bar">
  <span>9:41</span>
  <div class="status-icons">

    <svg width="66" height="30" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>

<div class="progress-bar-wrap">

      <!-- dist 4 -->

      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:32px;background:rgba(212,165,116,0.14);"></div><span class="tick-label">160</span></div>
    </div>
  </div>

  <!-- Goal badge -->
  <div class="goal-badge">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#D4A574" stroke-width="2"/><circle cx="12" cy="12" r="6" stroke="#D4A574" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#D4A574"/></svg>
    At this pace, you'll reach this by <strong style="color:#D4A574;">March 2027</strong>
  </div>

  <!-- CTA button -->

</div>

<!-- Bottom highlight -->

  <p>Your goal. Your pace. <strong>Your story.</strong></p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea – S3 Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    color: #1A1D3D;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 54px 90px 0; font-size: 48px; font-weight: 600;
  }
  .status-icons { display: flex; gap: 18px; align-items: center; }

  .caption-band {
    margin: 80px 90px 0;
    background: linear-gradient(135deg, #1A1D3D 0%, #2D3163 100%);
    border-radius: 54px; padding: 80px 90px; text-align: center;
  }
  .caption-band h1 { font-size: 100px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -3px; }
  .caption-band p { font-size: 54px; font-weight: 500; color: rgba(255,255,255,0.78); margin-top: 24px; }

  /* Header bar */
  .app-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin: 72px 90px 0;
  }
  .app-header h2 { font-size: 78px; font-weight: 900; color: #1A1D3D; letter-spacing: -2px; }
  .app-header p { font-size: 44px; color: #6E7585; margin-top: 12px; }
  .weekly-pill {
    background: rgba(212,165,116,0.12); border-radius: 30px;
    padding: 24px 54px; font-size: 44px; font-weight: 700; color: #D4A574;
    white-space: nowrap;
  }

  /* Countdown ring card */
  .ring-card {
    margin: 60px 90px 0;
    background: #fff; border-radius: 60px;
    padding: 72px; box-shadow: 0 16px 60px rgba(212,165,116,0.14);
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }
  .ring-label { font-size: 48px; font-weight: 500; color: #6E7585; }
  .ring-sub { font-size: 54px; font-weight: 700; color: #D4A574; }

  /* Log dose button */
  .log-btn {
    margin: 48px 90px 0;
    background: linear-gradient(135deg, #C4956A, #D4A574);
    border-radius: 48px; padding: 72px;
    display: flex; align-items: center; justify-content: center; gap: 42px;
    box-shadow: 0 16px 48px rgba(212,165,116,0.38);
  }
  .log-btn span { font-size: 72px; font-weight: 800; color: #fff; }

  /* Stats row */
  .stats-row { display: flex; gap: 36px; margin: 48px 90px 0; }
  .stat-card {
    flex: 1; background: #fff; border-radius: 48px;
    padding: 54px 36px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.05);
  }
  .stat-label { font-size: 40px; color: #6E7585; margin-bottom: 18px; }
  .stat-value { font-size: 84px; font-weight: 900; color: #1A1D3D; letter-spacing: -2px; }
  .stat-unit { font-size: 40px; color: #D4A574; font-weight: 600; margin-top: 6px; }

  /* Mini chart card */
  .chart-card {
    margin: 48px 90px 0;
    background: #fff; border-radius: 60px; padding: 66px;
    box-shadow: 0 16px 60px rgba(0,0,0,0.05);
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
  .chart-header h3 { font-size: 54px; font-weight: 700; color: #1A1D3D; }
  .chart-header span { font-size: 42px; font-weight: 700; color: #D4A574; }

  /* Bottom nav hint */
  .nav-hint {
    margin: 60px 90px 0;
    background: #F7F2EA; border-radius: 48px;
    padding: 54px 90px;
    display: flex; justify-content: space-around; align-items: center;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .nav-label { font-size: 38px; font-weight: 600; }
  .nav-label-active { font-size: 38px; font-weight: 700; color: #D4A574; }
</style>
</head>
<body>

<div class="status-bar">
  <span>9:41</span>
  <div class="status-icons">
    <svg width="42" height="30" viewBox="0 0 42 30" fill="none"><rect x="0" y="6" width="6" height="24" rx="2" fill="#1A1D3D"/><rect x="9" y="12" width="6" height="18" rx="2" fill="#1A1D3D"/><rect x="18" y="3" width="6" height="27" rx="2" fill="#1A1D3D"/><rect x="27" y="0" width="6" height="30" rx="2" fill="#1A1D3D"/></svg>
    <svg width="66" height="30" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>
  </div>
</div>

<div class="caption-band">
  <h1>Never Miss a Dose</h1>
  <p>Your countdown. Your schedule. Your control.</p>
</div>

<div class="app-header">
  <div>
    <h2>Good Morning</h2>
    <p>Ozempic · 0.5 mg · Weekly</p>
  </div>
  <div class="weekly-pill">Weekly</div>
</div>

<div class="ring-card">
  <div class="ring-label">Next dose in</div>
  <svg width="480" height="480" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="88" fill="none" stroke="#F7F2EA" stroke-width="14"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#D4A574" stroke-width="14"
      stroke-dasharray="553" stroke-dashoffset="158"
      stroke-linecap="round" transform="rotate(-90 100 100)"/>
    <text x="100" y="88" text-anchor="middle" font-size="54" font-weight="900" fill="#1A1D3D" font-family="Inter, sans-serif">5</text>
    <text x="100" y="130" text-anchor="middle" font-size="22" font-weight="500" fill="#6E7585" font-family="Inter, sans-serif">days left</text>
  </svg>
  <div class="ring-sub">Next dose: Fri, Aug 1 · Abdomen</div>
</div>

<div class="log-btn">
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2z" stroke="#fff" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
  <span>Log Today's Dose</span>
</div>

<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">Streak</div>
    <div class="stat-value">4</div>
    <div class="stat-unit">weeks 🔥</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Lost</div>
    <div class="stat-value">−9.4</div>
    <div class="stat-unit">lbs total</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Dose</div>
    <div class="stat-value">0.5</div>
    <div class="stat-unit">mg</div>
  </div>
</div>

<div class="chart-card">
  <div class="chart-header">
    <h3>Weight Trend</h3>
    <span>↓ 9.4 lbs</span>
  </div>
  <svg width="1080" height="300" viewBox="0 0 1080 300">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D4A574" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Grid lines -->
    <line x1="0" y1="60" x2="1080" y2="60" stroke="#F7F2EA" stroke-width="2"/>
    <line x1="0" y1="120" x2="1080" y2="120" stroke="#F7F2EA" stroke-width="2"/>
    <line x1="0" y1="180" x2="1080" y2="180" stroke="#F7F2EA" stroke-width="2"/>
    <line x1="0" y1="240" x2="1080" y2="240" stroke="#EDE8E2" stroke-width="2"/>
    <!-- Area fill -->
    <path d="M60,220 L270,198 L480,174 L690,148 L900,128 L900,240 L60,240Z" fill="url(#grad)"/>
    <!-- Line -->
    <polyline points="60,220 270,198 480,174 690,148 900,128"
      fill="none" stroke="#D4A574" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Goal dashed line -->
    <line x1="0" y1="210" x2="1080" y2="210" stroke="#D4A574" stroke-width="3" stroke-dasharray="16 10" opacity="0.35"/>
    <!-- Dots -->
    <circle cx="60" cy="220" r="10" fill="#D4A574" opacity="0.6"/>
    <circle cx="270" cy="198" r="10" fill="#D4A574" opacity="0.7"/>
    <circle cx="480" cy="174" r="10" fill="#D4A574" opacity="0.8"/>
    <circle cx="690" cy="148" r="10" fill="#D4A574" opacity="0.9"/>
    <circle cx="900" cy="128" r="14" fill="#fff" stroke="#D4A574" stroke-width="5"/>
    <!-- Label -->
    <rect x="820" y="68" width="180" height="54" rx="12" fill="#1A1D3D"/>
    <text x="910" y="104" text-anchor="middle" font-size="28" fill="#fff" font-weight="700" font-family="Inter,sans-serif">205.6 lbs</text>
    <!-- X labels -->
    <text x="60" y="290" text-anchor="middle" font-size="28" fill="#6E7585" font-family="Inter,sans-serif">Jun 3</text>
    <text x="270" y="290" text-anchor="middle" font-size="28" fill="#6E7585" font-family="Inter,sans-serif">Jun 17</text>
    <text x="480" y="290" text-anchor="middle" font-size="28" fill="#6E7585" font-family="Inter,sans-serif">Jul 1</text>
    <text x="690" y="290" text-anchor="middle" font-size="28" fill="#6E7585" font-family="Inter,sans-serif">Jul 15</text>
    <text x="900" y="290" text-anchor="middle" font-size="28" fill="#6E7585" font-family="Inter,sans-serif">Jul 29</text>
  </svg>
</div>

<div class="nav-hint">
  <div class="nav-item">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="#D4A574" stroke-width="2.5" fill="rgba(212,165,116,0.15)"/><path d="M9 22V12h6v10" stroke="#D4A574" stroke-width="2.5"/></svg>
    <span class="nav-label-active">Home</span>
  </div>
  <div class="nav-item">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#9CA3AF" stroke-width="2.5"/><path d="M16 2v4M8 2v4M3 10h18" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span class="nav-label" style="color:#9CA3AF">Log</span>
  </div>
  <div class="nav-item">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="nav-label" style="color:#9CA3AF">Weight</span>
  </div>
  <div class="nav-item">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#9CA3AF" stroke-width="2.5"/><path d="M12 8v4l3 3" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/></svg>
    <span class="nav-label" style="color:#9CA3AF">Meds</span>
  </div>
</div>

</body>
</html>

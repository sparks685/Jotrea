<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea V11 - 06 Med Cabinet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  /* Brand colors: #FFFDF7 #1A1D3D #D4A574 #C4956A #86A89A */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1320px; height: 2868px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden; color: #1A1D3D; position: relative;
    display: flex; flex-direction: column;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 60px 96px 0; font-size: 48px; font-weight: 600; flex-shrink: 0;
  }
  .caption-band {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #1A1D3D; border-radius: 80px 80px 0 0;
    padding: 100px 100px 140px;
  }
  .caption-band h1 { font-size: 116px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: -3px; }
  .caption-band p { font-size: 58px; font-weight: 500; color: rgba(255,255,255,0.72); margin-top: 32px; line-height: 1.4; }
  .app-content { flex: 1; position: relative; }
</style>
</head>
<body>
<div class="status-bar">
  <span>9:41</span>
  <div style="display:flex;gap:18px;align-items:center">
    <svg width="46" height="32" viewBox="0 0 42 30" fill="none"><rect x="0" y="6" width="6" height="24" rx="2" fill="#1A1D3D"/><rect x="9" y="12" width="6" height="18" rx="2" fill="#1A1D3D"/><rect x="18" y="3" width="6" height="27" rx="2" fill="#1A1D3D"/><rect x="27" y="0" width="6" height="30" rx="2" fill="#1A1D3D"/></svg>
    <svg width="72" height="32" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>
  </div>
</div>

<div class="app-content">
  <div style="margin:80px 100px 0;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:84px;font-weight:900;letter-spacing:-2px">Med Cabinet</div>
    <div style="background:#D4A574;color:#fff;border-radius:24px;padding:16px 32px;font-size:40px;font-weight:800">PLUS</div>
  </div>

  <div style="margin:60px 100px 0;display:flex;flex-direction:column;gap:40px">
    
    <div style="background:#fff;border:4px solid #D4A574;border-radius:60px;padding:60px;box-shadow:0 16px 60px rgba(212,165,116,0.15)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
        <div style="width:80px;height:80px;background:#D4A574;border-radius:20px;display:flex;align-items:center;justify-content:center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div style="background:#FFF8F0;color:#D4A574;font-size:36px;font-weight:800;padding:12px 30px;border-radius:20px">ACTIVE</div>
      </div>
      <div style="font-size:60px;font-weight:900;color:#1A1D3D">GLP-1 Medication</div>
      <div style="font-size:44px;color:#6E7585;margin-top:16px;line-height:1.5">
        2.5 mg · Weekly<br>As prescribed · Mondays
      </div>
      <div style="margin-top:40px;background:#F9FBFA;border-radius:30px;padding:30px 40px;font-size:42px;font-weight:700;color:#86A89A">
        Reminder · 8:00 AM
      </div>
    </div>

    <div style="background:#fff;border:3px solid #F7F2EA;border-radius:60px;padding:60px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
        <div style="width:80px;height:80px;background:#E7DDD2;border-radius:20px;display:flex;align-items:center;justify-content:center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6E7585" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div style="background:#F7F2EA;color:#6E7585;font-size:36px;font-weight:800;padding:12px 30px;border-radius:20px">ACTIVE</div>
      </div>
      <div style="font-size:60px;font-weight:900;color:#1A1D3D">Daily Multivitamin</div>
      <div style="font-size:44px;color:#6E7585;margin-top:16px;line-height:1.5">
        1 capsule · Daily
      </div>
    </div>

  </div>
</div>

<div class="caption-band" style="background:#D4A574">
  <h1>Medication Cabinet</h1>
  <p>Organize your prescribed medications and keep your tracker reminders in one place.</p>
</div>
</body>
</html>

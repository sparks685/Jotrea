<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea V11 - 02 Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  /* Brand colors: #FFFDF7 #1A1D3D #D4A574 #C4956A #86A89A */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1320px; height: 2868px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden; color: #1A1D3D; position: relative;
    display: flex; flex-direction: column;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 60px 96px 0; font-size: 48px; font-weight: 600; flex-shrink: 0;
  }
  .caption-band {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #1A1D3D; border-radius: 80px 80px 0 0;
    padding: 100px 100px 140px;
  }
  .caption-band h1 { font-size: 116px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: -3px; }
  .caption-band p { font-size: 58px; font-weight: 500; color: rgba(255,255,255,0.72); margin-top: 32px; line-height: 1.4; }
  .app-content { flex: 1; position: relative; }
</style>
</head>
<body>
<div class="status-bar">
  <span>9:41</span>
  <div style="display:flex;gap:18px;align-items:center">
    <svg width="46" height="32" viewBox="0 0 42 30" fill="none"><rect x="0" y="6" width="6" height="24" rx="2" fill="#1A1D3D"/><rect x="9" y="12" width="6" height="18" rx="2" fill="#1A1D3D"/><rect x="18" y="3" width="6" height="27" rx="2" fill="#1A1D3D"/><rect x="27" y="0" width="6" height="30" rx="2" fill="#1A1D3D"/></svg>
    <svg width="72" height="32" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>
  </div>
</div>

<div class="app-content">
  <div style="margin:80px 100px 0;display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-size:84px;font-weight:900;color:#1A1D3D;letter-spacing:-2px">Today</div>
      <div style="font-size:46px;color:#6E7585;margin-top:12px">Thursday, Oct 12</div>
    </div>
    <div style="background:rgba(134,168,154,0.15);border-radius:30px;padding:24px 54px;font-size:46px;font-weight:700;color:#86A89A">Week 12</div>
  </div>

  <div style="margin:60px 100px 0;background:#fff;border-radius:60px;padding:70px;box-shadow:0 16px 60px rgba(0,0,0,0.04);display:flex;align-items:center;gap:60px;border: 3px solid #F7F2EA">
    <div style="width:200px;height:200px;border-radius:50%;border:16px solid #F7F2EA;border-top-color:#86A89A;border-right-color:#86A89A;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:#1A1D3D;transform:rotate(-45deg);flex-shrink:0;">
      <span style="transform:rotate(45deg)">4</span>
    </div>
    <div>
      <div style="font-size:48px;font-weight:600;color:#6E7585">Days until next dose</div>
      <div style="font-size:68px;font-weight:800;color:#1A1D3D;margin-top:12px">Scheduled Mon</div>
      <div style="font-size:44px;font-weight:600;color:#86A89A;margin-top:12px">Recorded: 2.5 mg</div>
    </div>
  </div>

  <div style="margin:48px 100px 0;background:#fff;border-radius:60px;padding:70px;box-shadow:0 16px 60px rgba(0,0,0,0.04);border: 3px solid #F7F2EA">
    <div style="font-size:54px;font-weight:800;color:#1A1D3D;margin-bottom:50px">Daily Habits</div>
    <div style="display:flex;gap:40px">
      <div style="flex:1;background:#F9FBFA;border-radius:48px;padding:50px 40px;border:3px solid #86A89A">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#86A89A" stroke-width="2.5"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <div style="font-size:72px;font-weight:900;color:#86A89A;margin-top:20px">6<span style="font-size:40px;font-weight:600">/8</span></div>
        <div style="font-size:40px;font-weight:600;color:#86A89A;margin-top:10px">cups</div>
      </div>
      <div style="flex:1;background:#FFFDF7;border-radius:48px;padding:50px 40px;border:3px solid #D4A574">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2.5"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 4v-2"/></svg>
        <div style="font-size:72px;font-weight:900;color:#D4A574;margin-top:20px">65<span style="font-size:40px;font-weight:600">g</span></div>
        <div style="font-size:40px;font-weight:600;color:#D4A574;margin-top:10px">protein</div>
      </div>
    </div>
  </div>
</div>

<div class="caption-band" style="background:#D4A574">
  <h1>A Clear Daily Overview</h1>
  <p>Track your progress and keep your records perfectly organized.</p>
</div>
</body>
</html>

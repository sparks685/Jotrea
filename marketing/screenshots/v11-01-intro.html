<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea V11 - 01 Intro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  /* Brand colors: #FFFDF7 #1A1D3D #D4A574 #C4956A #86A89A */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1320px; height: 2868px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  .caption-band {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #1A1D3D; border-radius: 80px 80px 0 0;
    padding: 100px 100px 140px;
  }
  .caption-band h1 { font-size: 116px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: -3px; }
  .caption-band p { font-size: 58px; font-weight: 500; color: rgba(255,255,255,0.72); margin-top: 32px; line-height: 1.4; }
  .app-content { flex: 1; position: relative; padding: 100px; }
</style>
</head>
<body>
<div class="status-bar">
  <span>9:41</span>
  <div style="display:flex;gap:18px;align-items:center">
    <svg width="46" height="32" viewBox="0 0 42 30" fill="none"><rect x="0" y="6" width="6" height="24" rx="2" fill="#1A1D3D"/><rect x="9" y="12" width="6" height="18" rx="2" fill="#1A1D3D"/><rect x="18" y="3" width="6" height="27" rx="2" fill="#1A1D3D"/><rect x="27" y="0" width="6" height="30" rx="2" fill="#1A1D3D"/></svg>

  </div>
</div>

<div class="app-content">
  <div style="font-size:96px;font-weight:900;color:#1A1D3D;letter-spacing:-2px;line-height:1.1">
    Good Morning,<br><span style="color:#D4A574">Your Tracker is Ready</span>
  </div>
  
  <div style="margin-top:100px;background:#fff;border-radius:60px;padding:60px;box-shadow:0 20px 60px rgba(0,0,0,0.05);display:flex;gap:40px;align-items:center;">
     <div style="width:120px;height:120px;background:#86A89A;border-radius:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">

  </div>

  <div style="margin-top:48px;background:#fff;border-radius:60px;padding:60px;box-shadow:0 20px 60px rgba(0,0,0,0.05);display:flex;gap:40px;align-items:center;">
     <div style="width:120px;height:120px;background:#D4A574;border-radius:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
       <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

     </div>
  </div>

<div class="caption-band">
  <h1>Your Private GLP-1 Tracker</h1>
  <p>Meticulously organized for your routine. Your records stay private.</p>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jotrea – iPad S2 Goal Weight</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2064px; height: 2752px;
    background: #FFFDF7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden; color: #1A1D3D;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 72px 144px 0; font-size: 60px; font-weight: 600;
  }
  .progress-bar-wrap { height: 10px; background: #EDE8E2; margin-top: 24px; }
  .progress-bar-fill { height: 10px; width: 36%; background: #D4A574; border-radius: 0 5px 5px 0; }

  .caption-band {
    margin: 90px 144px 0;
    background: linear-gradient(135deg, #1A1D3D 0%, #2D3163 100%);
    border-radius: 72px; padding: 96px 144px; text-align: center;
  }
  .caption-band h1 { font-size: 132px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -4px; }
  .caption-band p { font-size: 66px; font-weight: 500; color: rgba(255,255,255,0.8); margin-top: 30px; }

  /* Screen card — centered narrow column like mobile */
  .screen-card {
    margin: 90px 240px 0; background: #fff; border-radius: 84px;
    padding: 90px 96px 96px; box-shadow: 0 24px 80px rgba(0,0,0,0.08);
  }
  .back-btn {
    width: 96px; height: 96px; border-radius: 50%;
    background: #F7F2EA; border: 2px solid #EDE8E2;
    display: flex; align-items: center; justify-content: center; margin-bottom: 60px;
  }
  .step-title { font-size: 120px; font-weight: 900; color: #1A1D3D; letter-spacing: -3px; margin-bottom: 24px; }
  .step-sub { font-size: 60px; color: #6E7585; margin-bottom: 84px; }

  .weight-display { text-align: center; margin-bottom: 72px; }
  .weight-label { font-size: 44px; font-weight: 600; color: #D4A574; letter-spacing: 8px; text-transform: uppercase; }
  .weight-value { font-size: 240px; font-weight: 900; color: #1A1D3D; letter-spacing: -8px; line-height: 1; margin-top: 24px; }
  .weight-unit { font-size: 72px; font-weight: 400; color: #6E7585; margin-top: 18px; }

  /* Ruler */
  .ruler-wrap { position: relative; height: 300px; overflow: hidden; margin: 0 -24px; }
  .ruler-mask {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(to right, #fff 0%, transparent 12%, transparent 88%, #fff 100%);
  }
  .ruler-needle {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; z-index: 3;
    background: linear-gradient(to bottom, rgba(212,165,116,0) 0%, #D4A574 8%, #D4A574 72%, rgba(212,165,116,0.1) 100%);
    border-radius: 9999px; box-shadow: 0 0 24px rgba(212,165,116,0.6);
  }
  .ruler-inner { display: flex; align-items: flex-end; height: 100%; }
  .ruler-tick { flex-shrink: 0; width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .tick-bar { border-radius: 9999px; }
  .tick-label { font-size: 34px; font-weight: 600; color: rgba(156,163,175,0.7); margin-top: 18px; }
  .tick-label-active { font-size: 38px; font-weight: 800; color: #1A1D3D; margin-top: 18px; }

  .goal-badge {
    display: flex; align-items: center; gap: 24px;
    background: rgba(212,165,116,0.1); color: #D4A574;
    border-radius: 72px; padding: 36px 60px;
    font-size: 52px; font-weight: 600;
    margin-top: 72px; justify-content: center;
  }

  .cta-btn {
    width: 100%; background: #D4A574; border-radius: 60px;
    padding: 72px 0; text-align: center;
    box-shadow: 0 16px 48px rgba(212,165,116,0.35); margin-top: 84px;
  }
  .cta-btn span { font-size: 72px; font-weight: 800; color: #fff; }
</style>
</head>
<body>

<div class="status-bar">
  <span>9:41</span>
  <div style="display:flex;gap:24px;align-items:center;">
    <svg width="54" height="38" viewBox="0 0 42 30" fill="none"><rect x="0" y="6" width="6" height="24" rx="2" fill="#1A1D3D"/><rect x="9" y="12" width="6" height="18" rx="2" fill="#1A1D3D"/><rect x="18" y="3" width="6" height="27" rx="2" fill="#1A1D3D"/><rect x="27" y="0" width="6" height="30" rx="2" fill="#1A1D3D"/></svg>
    <svg width="84" height="38" viewBox="0 0 66 30" fill="none"><rect x="0" y="3" width="60" height="24" rx="6" stroke="#1A1D3D" stroke-width="2.5" fill="none"/><rect x="3" y="6" width="48" height="18" rx="4" fill="#1A1D3D"/></svg>
  </div>
</div>

      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:54px;background:rgba(212,165,116,0.28);"></div><span class="tick-label">145</span></div>

      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:50px;background:rgba(212,165,116,0.52);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:72px;background:rgba(212,165,116,0.68);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:102px;background:rgba(212,165,116,0.84);"></div></div>
      <!-- CENTER -->
      <div class="ruler-tick" style="width:80px;">
        <div class="tick-bar" style="width:6px;height:162px;background:#D4A574;box-shadow:0 0 24px rgba(212,165,116,0.55);"></div>
        <span class="tick-label-active">150</span>
      </div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:102px;background:rgba(212,165,116,0.84);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:72px;background:rgba(212,165,116,0.68);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:50px;background:rgba(212,165,116,0.52);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:38px;background:rgba(212,165,116,0.4);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:54px;background:rgba(212,165,116,0.28);"></div><span class="tick-label">155</span></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:26px;background:rgba(212,165,116,0.14);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:26px;background:rgba(212,165,116,0.14);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:26px;background:rgba(212,165,116,0.14);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:4px;height:26px;background:rgba(212,165,116,0.14);"></div></div>
      <div class="ruler-tick"><div class="tick-bar" style="width:5px;height:42px;background:rgba(212,165,116,0.14);"></div><span class="tick-label">160</span></div>
    </div>
  </div>

  <div class="goal-badge">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#D4A574" stroke-width="2"/><circle cx="12" cy="12" r="6" stroke="#D4A574" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="#D4A574"/></svg>
    At this pace, you'll reach this by <strong style="color:#D4A574;">March 2027</strong>
  </div>

  <div class="cta-btn"><span>Continue</span></div>
</div>

</body>
</html>
